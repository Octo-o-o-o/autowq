name: windows-exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Build single-file tray exe
        shell: pwsh
        run: packaging/windows/build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WorldQuantTray-exe
          path: dist/WorldQuantTray.exe
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WorldQuantTray.exe
