name: windows-exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 全量单测以 POSIX 平台为准（见 tests.yml 的 ubuntu/macos 矩阵）；
      # Windows 此处只跑托盘专项测试，引擎可移植性以打包产物冒烟验证。
      - name: Run Windows tray tests
        run: python -m unittest discover -s tests -p test_windows_tray.py -v
        env:
          PYTHONPATH: src
      - name: Build single-file tray exe
        shell: pwsh
        run: packaging/windows/build_exe.ps1
      # 冒烟：打包产物本身（不是源码）能当 CLI 用、能在无配置目录完成 API 渠道初始化并生成调度参数。
      - name: Smoke test packaged exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/WorldQuantTray.exe).Path
          $expected = (python -c "import re;print(re.search(r'^version = \"(.+?)\"', open('pyproject.toml').read(), re.M).group(1))").Trim()
          $version = (& $exe --engine --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "wq $expected") { throw "version: '$version' (expected wq $expected)" }
          $ws = Join-Path $env:RUNNER_TEMP 'wq-ws'; $rt = Join-Path $env:RUNNER_TEMP 'wq-rt'
          New-Item -ItemType Directory -Force $ws | Out-Null
          & $exe --workspace $ws --engine onboard --non-interactive --lang en --skip-login `
            --free gemini-free --free groq-free --research gemini-free --review groq-free --engineering groq-free `
            --runtime $rt | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "onboard exit $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $ws 'config/config.json'))) { throw 'config.json missing' }
          & $exe --workspace $ws --engine status | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "status exit $LASTEXITCODE" }
          $cli = (& $exe --install-cli | Out-String | ConvertFrom-Json).wq
          $viaCmd = (& cmd /c "`"$cli`" --version" | Out-String).Trim()
          if ($viaCmd -ne "wq $expected") { throw "wq.cmd: '$viaCmd'" }
      - uses: actions/upload-artifact@v4
        with:
          name: WorldQuantTray-exe
          path: dist/WorldQuantTray.exe
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/WorldQuantTray.exe
