name: dmg

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WorldQuant-dmg
          path: dist/*.dmg
      # Public releases use locally signed and notarized artifacts. CI's ad-hoc
      # build stays a workflow artifact and must never overwrite those bytes.
