name: dmg

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WorldQuant-dmg
          path: dist/*.dmg
      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.dmg
