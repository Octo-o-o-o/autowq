[project]
name = "wq-pilot"
version = "0.1.0"
description = "Local research orchestration with gated providers and recoverable simulations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wq = "wq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wq", "wq.adapters", "wq.wrappers"]
